<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Lume — Template 3 · 3 Tamanhos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Roboto:wght@500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.min.js"></script>
<style>
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:'Inter',sans-serif; background:#f1f5f9; }
header { background:linear-gradient(135deg,#00897B,#002B22); color:#fff; padding:14px 28px; display:flex; align-items:center; gap:16px; position:sticky; top:0; z-index:100; box-shadow:0 2px 12px rgba(0,0,0,.3); }
header strong { font-size:17px; font-weight:800; }
header span { font-size:12px; opacity:.65; }
.grid { display:flex; flex-wrap:wrap; gap:32px; padding:32px; justify-content:center; align-items:flex-start; }
.cw { background:#fff; border-radius:14px; overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,.1); transition:transform .15s,box-shadow .15s; }
.cw:hover { transform:translateY(-3px); box-shadow:0 12px 32px rgba(0,0,0,.14); }
.pb { position:relative; overflow:hidden; background:#0a0f1a; cursor:zoom-in; }
.pb .in { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; overflow:hidden; }
.cl { padding:12px 16px; border-top:1px solid #f1f5f9; display:flex; justify-content:space-between; align-items:center; gap:12px; }
.cl .info { display:flex; flex-direction:column; gap:2px; }
.cl b { color:#334155; font-size:13px; font-weight:700; }
.cl small { color:#94a3b8; font-size:11px; font-weight:600; }
.dl { background:#0d9488; color:#fff; border:none; border-radius:8px; padding:8px 16px; font-size:12px; font-weight:700; font-family:inherit; cursor:pointer; display:flex; align-items:center; gap:6px; white-space:nowrap; transition:background .15s; }
.dl:hover { background:#0f766e; }
.dl:disabled { background:#94a3b8; cursor:wait; }
#modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.93); z-index:200; align-items:center; justify-content:center; padding:16px; }
#modal.open { display:flex; }
#mi { position:relative; }
#mx { position:absolute; top:-44px; right:0; background:none; border:none; color:#fff; font-size:26px; cursor:pointer; font-weight:800; opacity:.7; }
#mx:hover { opacity:1; }
#mf { position:absolute; bottom:-30px; left:0; color:rgba(255,255,255,.4); font-size:11px; font-family:inherit; }
.tpl { font-family:'Inter',sans-serif; position:relative; overflow:hidden; }
.tpl * { box-sizing:border-box; }
</style>
</head>
<body>

<header>
  <strong>✦ Lume — Template 3 · Foto sumiu</strong>
  <span>3 tamanhos: Quadrado 1:1 · Vertical 9:16 · Horizontal 1,91:1</span>
</header>

<div class="grid" id="grid"></div>
<div id="modal"><div id="mi"><button id="mx" onclick="cls()">✕</button><div id="mc"></div><div id="mf"></div></div></div>

<script>

/* ─── Shared helpers ─────────────────────────────────────────── */
function phoneDark(src, w, imgStyle='') {
  return `<div style="background:#030712;border-radius:40px;padding:7px;box-shadow:0 0 0 1px rgba(255,255,255,.12),0 0 60px rgba(0,0,0,.55),0 8px 24px rgba(0,0,0,.45);display:inline-block;flex-shrink:0">
    <div style="border-radius:33px;overflow:hidden;line-height:0;display:block"><img src="${src}" width="${w}" style="display:block;${imgStyle}"></div>
  </div>`
}

function bug(dark=true) {
  return `<div style="position:absolute;bottom:28px;right:36px;display:flex;align-items:center;gap:10px;opacity:${dark?.28:.32}">
    <img src="/images/site/${dark?'white_logo':'green_logo'}.png" width="48" style="display:block">
    <span style="font-size:28px;font-weight:500;font-family:'Roboto',sans-serif;color:${dark?'#fff':'#0f766e'};letter-spacing:.01em">Lume</span>
  </div>`
}

/* ─── Templates ──────────────────────────────────────────────── */
const T = [

/* ── QUADRADO 1:1 — 1080×1080 ─────────────────────────────────── */
{
  id: 'square',
  label: 'Quadrado 1:1',
  dim: '1080×1080',
  W: 1080, H: 1080,
  filename: 'lume-template3-quadrado-1080x1080.png',
  html: `
<div class="tpl" style="width:1080px;height:1080px;background:#0a0f1a">
  <div style="display:flex;height:100%">

    <!-- Texto -->
    <div style="flex:1;padding:72px 44px 72px 72px;display:flex;flex-direction:column;justify-content:center;gap:28px;min-width:0">

      <span style="background:rgba(255,255,255,.08);color:rgba(255,255,255,.5);font-size:24px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;padding:10px 22px;border-radius:100px;display:inline-block;width:fit-content">Soa familiar?</span>

      <h2 style="font-size:58px;font-weight:900;color:#fff;line-height:1.05;letter-spacing:-1.5px">
        A foto de antes<br>simplesmente<br><span style="color:#f87171">sumiu.</span>
      </h2>

      <p style="font-size:21px;color:rgba(255,255,255,.5);line-height:1.65">
        Enterrada no WhatsApp entre centenas<br>de imagens. Sem data, sem contexto.<br>Impossível de encontrar quando mais precisa.
      </p>

      <div style="display:flex;align-items:flex-start;gap:16px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:22px 26px">
        <span style="width:28px;height:28px;border-radius:50%;background:rgba(45,212,191,.2);border:1.5px solid rgba(45,212,191,.45);display:inline-flex;align-items:center;justify-content:center;color:#5eead4;font-size:12px;font-weight:900;flex-shrink:0;margin-top:2px">✓</span>
        <span style="font-size:21px;color:#2dd4bf;font-weight:600;line-height:1.55">Histórico visual completo, organizado por cliente e data.</span>
      </div>

    </div>

    <!-- Celular -->
    <div style="width:400px;flex-shrink:0;display:flex;align-items:center;justify-content:center;padding:28px 44px 28px 8px">
      ${phoneDark('/images/site/screen_patient_details.jpeg', 320)}
    </div>

  </div>
  ${bug()}
</div>`
},

/* ── VERTICAL 9:16 — 1080×1920 ────────────────────────────────── */
{
  id: 'vertical',
  label: 'Vertical 9:16',
  dim: '1080×1920',
  W: 1080, H: 1920,
  filename: 'lume-template3-vertical-1080x1920.png',
  html: `
<div class="tpl" style="width:1080px;height:1920px;background:#0a0f1a;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:100px 96px 80px;gap:0">

  <!-- Pill -->
  <span style="background:rgba(255,255,255,.08);color:rgba(255,255,255,.5);font-size:28px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;padding:12px 28px;border-radius:100px;display:inline-block;margin-bottom:44px">Soa familiar?</span>

  <!-- Título -->
  <h2 style="font-size:82px;font-weight:900;color:#fff;line-height:1.04;letter-spacing:-2.5px;text-align:center;margin-bottom:32px">
    A foto de antes<br>simplesmente<br><span style="color:#f87171">sumiu.</span>
  </h2>

  <!-- Corpo -->
  <p style="font-size:27px;color:rgba(255,255,255,.5);line-height:1.65;text-align:center;max-width:860px;margin-bottom:40px">
    O resultado ficou incrível, mas a foto está enterrada entre centenas de imagens no WhatsApp. Sem data. Sem contexto. Nada.
  </p>

  <!-- Fix box -->
  <div style="display:flex;align-items:flex-start;gap:20px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:22px;padding:28px 34px;width:100%;max-width:860px;margin-bottom:72px">
    <span style="width:34px;height:34px;border-radius:50%;background:rgba(45,212,191,.2);border:1.5px solid rgba(45,212,191,.45);display:inline-flex;align-items:center;justify-content:center;color:#5eead4;font-size:14px;font-weight:900;flex-shrink:0;margin-top:2px">✓</span>
    <span style="font-size:27px;color:#2dd4bf;font-weight:600;line-height:1.55">Histórico visual completo, organizado por cliente e data. Nunca mais perde uma foto.</span>
  </div>

  <!-- Celular na base -->
  <div style="flex-shrink:0">
    ${phoneDark('/images/site/screen_patient_details.jpeg', 400)}
  </div>

  ${bug()}
</div>`
},

/* ── HORIZONTAL 1,91:1 — 1200×628 ─────────────────────────────── */
{
  id: 'horizontal',
  label: 'Horizontal 1,91:1',
  dim: '1200×628',
  W: 1200, H: 628,
  filename: 'lume-template3-horizontal-1200x628.png',
  html: `
<div class="tpl" style="width:1200px;height:628px;background:#0a0f1a;display:flex;overflow:hidden">

  <!-- Texto -->
  <div style="flex:1;padding:52px 40px 52px 64px;display:flex;flex-direction:column;justify-content:center;gap:20px;min-width:0">

    <span style="background:rgba(255,255,255,.08);color:rgba(255,255,255,.5);font-size:21px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;padding:8px 18px;border-radius:100px;display:inline-block;width:fit-content">Soa familiar?</span>

    <h2 style="font-size:46px;font-weight:900;color:#fff;line-height:1.06;letter-spacing:-1.5px">
      A foto de antes<br>simplesmente<br><span style="color:#f87171">sumiu.</span>
    </h2>

    <p style="font-size:19px;color:rgba(255,255,255,.5);line-height:1.6;max-width:540px">
      O resultado ficou incrível, mas a foto está enterrada entre centenas de imagens no WhatsApp. Sem data, sem contexto.
    </p>

    <div style="display:flex;align-items:flex-start;gap:14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:18px 22px">
      <span style="width:26px;height:26px;border-radius:50%;background:rgba(45,212,191,.2);border:1.5px solid rgba(45,212,191,.45);display:inline-flex;align-items:center;justify-content:center;color:#5eead4;font-size:11px;font-weight:900;flex-shrink:0;margin-top:1px">✓</span>
      <span style="font-size:19px;color:#2dd4bf;font-weight:600;line-height:1.55">Histórico visual completo, organizado por cliente e data.</span>
    </div>

  </div>

  <!-- Celular (cortado na base pelo overflow:hidden — efeito intencional) -->
  <div style="width:360px;flex-shrink:0;height:628px;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:0 44px 0 0">
    ${phoneDark('/images/site/screen_patient_details.jpeg', 258)}
  </div>

  ${bug()}
</div>`
},

]

/* ─── Render preview cards ───────────────────────────────────── */
const PW = 300

function render() {
  document.getElementById('grid').innerHTML = T.map(t => {
    const pH = Math.round(PW * t.H / t.W)
    const sc  = PW / t.W
    return `
    <div class="cw">
      <div class="pb" style="width:${PW}px;height:${pH}px" onclick="opn('${t.id}')">
        <div class="in">
          <div style="width:${t.W}px;transform:scale(${sc});transform-origin:center center;flex-shrink:0">${t.html}</div>
        </div>
      </div>
      <div class="cl">
        <div class="info">
          <b>${t.label}</b>
          <small>${t.dim}</small>
        </div>
        <button class="dl" id="dl-${t.id}" onclick="dl('${t.id}')">⬇ Baixar</button>
      </div>
    </div>`
  }).join('')
}

/* ─── Modal (zoom) ───────────────────────────────────────────── */
function opn(id) {
  const t = T.find(x => x.id === id)
  const sc = Math.min(
    (window.innerHeight * .9) / t.H,
    (window.innerWidth  * .9) / t.W
  )
  const dw = Math.round(t.W * sc)
  const dh = Math.round(t.H * sc)
  document.getElementById('mc').innerHTML = `
    <div style="width:${dw}px;height:${dh}px;overflow:hidden;border-radius:10px;box-shadow:0 24px 80px rgba(0,0,0,.7)">
      <div style="width:${t.W}px;height:${t.H}px;transform:scale(${sc});transform-origin:top left">${t.html}</div>
    </div>`
  document.getElementById('mf').textContent = `${t.label} · ${t.dim}`
  document.getElementById('modal').classList.add('open')
}

function cls() { document.getElementById('modal').classList.remove('open') }
document.getElementById('modal').addEventListener('click', e => { if (e.target === document.getElementById('modal')) cls() })
document.addEventListener('keydown', e => { if (e.key === 'Escape') cls() })

/* ─── Download ───────────────────────────────────────────────── */
async function dl(id) {
  const t   = T.find(x => x.id === id)
  const btn = document.getElementById('dl-' + id)
  btn.disabled    = true
  btn.textContent = '⏳'

  try {
    const wrap = document.createElement('div')
    wrap.style.cssText = `position:fixed;left:-${t.W + 100}px;top:0;width:${t.W}px;height:${t.H}px`
    wrap.innerHTML = t.html
    document.body.appendChild(wrap)

    const imgs = [...wrap.querySelectorAll('img')]
    await Promise.all(imgs.map(img => {
      if (img.complete && img.naturalWidth > 0) return Promise.resolve()
      return new Promise(resolve => { img.onload = resolve; img.onerror = resolve })
    }))

    const blob = await htmlToImage.toBlob(wrap.firstElementChild, {
      width: t.W, height: t.H, pixelRatio: 1,
    })
    document.body.removeChild(wrap)

    const a = document.createElement('a')
    a.download = t.filename
    a.href = URL.createObjectURL(blob)
    a.click()
    URL.revokeObjectURL(a.href)
  } finally {
    btn.disabled    = false
    btn.textContent = '⬇ Baixar'
  }
}

render()
</script>
</body>
</html>
