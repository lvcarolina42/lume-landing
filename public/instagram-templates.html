<style>
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:'Inter',sans-serif; background:#f1f5f9; }
header { background:linear-gradient(135deg,#00897B,#002B22); color:#fff; padding:14px 24px; display:flex; align-items:center; gap:12px; position:sticky; top:0; z-index:100; box-shadow:0 2px 12px rgba(0,0,0,.3); }
header strong { font-size:17px; font-weight:800; }
header span { font-size:12px; opacity:.65; }
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:20px; padding:24px; }
.cw { background:#fff; border-radius:12px; overflow:hidden; box-shadow:0 1px 4px rgba(0,0,0,.08); cursor:zoom-in; transition:transform .15s,box-shadow .15s; }
.cw:hover { transform:translateY(-3px); box-shadow:0 10px 28px rgba(0,0,0,.12); }
.pb { position:relative; overflow:hidden; background:#0f172a; }
.pb .in { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; overflow:hidden; }
.cl { padding:10px 14px; font-size:11px; font-weight:700; color:#94a3b8; border-top:1px solid #f1f5f9; display:flex; justify-content:space-between; align-items:center; gap:8px; }
.cl b { color:#334155; font-size:12px; flex:1; min-width:0; }
.dl { background:#0d9488; color:#fff; border:none; border-radius:8px; padding:6px 12px; font-size:11px; font-weight:700; font-family:inherit; cursor:pointer; display:flex; align-items:center; gap:5px; white-space:nowrap; flex-shrink:0; transition:background .15s; }
.dl:hover { background:#0f766e; }
.dl:disabled { background:#94a3b8; cursor:wait; }
.dl-all { background:rgba(255,255,255,.15); border:1px solid rgba(255,255,255,.3); color:#fff; border-radius:8px; padding:7px 16px; font-size:12px; font-weight:700; font-family:inherit; cursor:pointer; display:flex; align-items:center; gap:6px; transition:background .15s; }
.dl-all:hover { background:rgba(255,255,255,.25); }
#prog { font-size:12px; opacity:.7; }
#modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.93); z-index:200; align-items:center; justify-content:center; padding:16px; }
#modal.open { display:flex; }
#mi { position:relative; }
#mx { position:absolute; top:-42px; right:0; background:none; border:none; color:#fff; font-size:24px; cursor:pointer; font-weight:800; opacity:.7; }
#mx:hover { opacity:1; }
#mf { position:absolute; bottom:-28px; left:0; color:rgba(255,255,255,.4); font-size:11px; font-family:inherit; }

/* Template base */
.tpl { width:1080px; font-family:'Inter',sans-serif; position:relative; overflow:hidden; }
.tpl * { box-sizing:border-box; }

<body>

<header>
  <strong>✦ Lume — Templates Instagram</strong>
  <span>15 posts · 4:5 · 1080×1350 · clique para ampliar</span>
  <span style="flex:1"></span>
  <span id="prog"></span>
  <button class="dl-all" onclick="downloadAll()">⬇ Baixar todos</button>
</header>

<div class="grid" id="grid"></div>
<div id="modal"><div id="mi"><button id="mx" onclick="cls()">✕</button><div id="mc"></div><div id="mf"></div></div></div>

<script>
const W = 1080, H = 1350

/* ── Phone frames — exact match to landing page ─────────────────── */

// Hero phone: bg-gray-950 rounded-[2.5rem] p-[7px] ring-1 ring-white/10 shadow-2xl
function phoneDark(src, w=390, imgStyle='') {
  return `<div style="background:#030712;border-radius:40px;padding:7px;box-shadow:0 0 0 1px rgba(255,255,255,.12),0 0 60px rgba(0,0,0,.55),0 8px 24px rgba(0,0,0,.45);display:inline-block;flex-shrink:0">
    <div style="border-radius:33px;overflow:hidden;line-height:0;display:block"><img src="${src}" width="${w}" style="display:block;${imgStyle}"></div>
  </div>`
}

// Feature phone: bg-gray-100 rounded-[2.5rem] p-2 ring-1 ring-black/5 shadow-2xl + teal glow
function phoneLight(src, w=340) {
  return `<div style="position:relative;display:inline-block;flex-shrink:0">
    <div style="position:absolute;inset:-20px;background:rgba(20,184,166,.12);border-radius:60px;filter:blur(32px);pointer-events:none"></div>
    <div style="position:relative;background:#f3f4f6;border-radius:40px;padding:8px;box-shadow:0 0 0 1px rgba(0,0,0,.05),0 0 40px rgba(0,0,0,.12),0 8px 20px rgba(0,0,0,.14);display:inline-block">
      <div style="border-radius:32px;overflow:hidden;line-height:0;display:block"><img src="${src}" width="${w}" style="display:block"></div>
    </div>
  </div>`
}

/* ── Shared atoms ──────────────────────────────────────────────── */
const avs = () => 'ARCLM'.split('').map((l,i)=>
  `<div style="width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#2dd4bf,#0f766e);border:2.5px solid rgba(0,30,20,.5);display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:800;margin-left:${i?-10:0}px">${l}</div>`
).join('')

// Matching landing page hero bullet: rounded-full bg-teal-400/30 border border-teal-400/60
const crHero = () => `<span style="width:22px;height:22px;border-radius:50%;background:rgba(45,212,191,.25);border:1.5px solid rgba(45,212,191,.55);display:inline-flex;align-items:center;justify-content:center;color:#5eead4;font-size:9px;font-weight:900;flex-shrink:0">✓</span>`

// Matching landing page feature chip: bg-teal-50 text-teal-700 rounded-full
const chip = (t) => `<span style="background:#f0fdfa;color:#0f766e;font-size:20px;font-weight:600;padding:11px 20px;border-radius:100px;display:inline-flex;align-items:center;gap:8px"><span style="color:#2dd4bf;font-size:14px">✓</span>${t}</span>`

// Matching landing page feature badge: text-teal-600 bg-teal-50 rounded-full tracking-wide
const badge = (t) => `<span style="font-size:20px;font-weight:700;color:#0d9488;background:#f0fdfa;padding:11px 24px;border-radius:100px;display:inline-block;letter-spacing:.03em;margin-bottom:28px">${t}</span>`

// Dark section badge
const pilld = (t) => `<span style="background:rgba(255,255,255,.08);color:rgba(255,255,255,.55);font-size:20px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding:11px 24px;border-radius:100px;display:inline-block">${t}</span>`

// Bug watermark
const bug = (dark=true) => `<div style="position:absolute;bottom:28px;right:36px;display:flex;align-items:center;gap:10px;opacity:${dark?.28:.32}">
  <img src="/images/site/${dark?'white_logo':'green_logo'}.png" width="48" style="display:block">
  <span style="font-size:28px;font-weight:500;font-family:'Roboto',sans-serif;color:${dark?'#fff':'#0f766e'};letter-spacing:.01em">Lume</span>
</div>`

/* Feature section text block */
function featText(bdg, title, desc, highlights, align='left') {
  const ta = align==='center' ? 'text-align:center' : ''
  return `<div style="${ta}">
    ${badge(bdg)}
    <h3 style="font-size:70px;font-weight:900;color:#111827;line-height:1.06;letter-spacing:-2px;margin-bottom:24px">${title}</h3>
    <p style="font-size:22px;color:#6b7280;line-height:1.6;margin-bottom:32px">${desc}</p>
    <div style="display:flex;flex-wrap:wrap;gap:12px">${highlights.map(chip).join('')}</div>
  </div>`
}

/* Problem section text block */
function painText(emoji, hl, body, fix) {
  return `<div>
    <h2 style="font-size:68px;font-weight:900;color:#fff;line-height:1.05;letter-spacing:-2px;margin-bottom:28px">${hl}</h2>
    <p style="font-size:22px;color:rgba(255,255,255,.52);line-height:1.65;margin-bottom:40px">${body}</p>
    <div style="display:flex;align-items:flex-start;gap:18px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:26px 30px">
      <span style="width:32px;height:32px;border-radius:50%;background:rgba(45,212,191,.2);border:1.5px solid rgba(45,212,191,.45);display:inline-flex;align-items:center;justify-content:center;color:#5eead4;font-size:13px;font-weight:900;flex-shrink:0;margin-top:2px">✓</span>
      <span style="font-size:22px;color:#2dd4bf;font-weight:600;line-height:1.5">${fix}</span>
    </div>
  </div>`
}

/* ── Render ─────────────────────────────────────────────────────── */
function render() {
  const PV = 270
  const pH = Math.round(PV * H / W)
  const sc = PV / W
  document.getElementById('grid').innerHTML = T.map(t => `
    <div class="cw">
      <div class="pb" style="height:${pH}px;cursor:zoom-in" onclick="opn(${t.n})">
        <div class="in">
          <div style="width:${W}px;transform:scale(${sc});transform-origin:center center;flex-shrink:0">${t.html}</div>
        </div>
      </div>
      <div class="cl">
        <b>${t.n}. ${t.title}</b>
        <button class="dl" id="dl${t.n}" onclick="dl(${t.n})">⬇ Baixar</button>
      </div>
    </div>`).join('')
}

function opn(n) {
  const t = T.find(x=>x.n===n)
  const sc = Math.min(window.innerHeight*.9/H, window.innerWidth*.9/W)
  const dw = Math.round(W*sc), dh = Math.round(H*sc)
  document.getElementById('mc').innerHTML = `
    <div style="width:${dw}px;height:${dh}px;overflow:hidden;border-radius:10px;box-shadow:0 24px 80px rgba(0,0,0,.7)">
      <div style="width:${W}px;height:${H}px;transform:scale(${sc});transform-origin:top left">${t.html}</div>
    </div>`
  document.getElementById('mf').textContent = `Post ${n} — ${t.title} — 4:5 · 1080×1350`
  document.getElementById('modal').classList.add('open')
}

function cls() { document.getElementById('modal').classList.remove('open') }
document.getElementById('modal').addEventListener('click',e=>{if(e.target===document.getElementById('modal'))cls()})
document.addEventListener('keydown',e=>{if(e.key==='Escape')cls()})

/* ── Download ───────────────────────────────────────────────────── */
async function capture(n) {
  const t = T.find(x=>x.n===n)
  const wrap = document.createElement('div')
  wrap.style.cssText = `position:fixed;left:-${W+100}px;top:0;width:${W}px;height:${H}px`
  wrap.innerHTML = t.html
  document.body.appendChild(wrap)

  const imgs = [...wrap.querySelectorAll('img')]
  await Promise.all(imgs.map(img => {
    if (img.complete && img.naturalWidth > 0) return Promise.resolve()
    return new Promise(resolve => { img.onload = resolve; img.onerror = resolve })
  }))

  const blob = await htmlToImage.toBlob(wrap.firstElementChild, {
    width: W, height: H, pixelRatio: 1,
  })
  document.body.removeChild(wrap)
  return blob
}

async function dl(n) {
  const btn = document.getElementById('dl'+n)
  btn.disabled = true
  btn.textContent = '⏳'
  try {
    const blob = await capture(n)
    const a = document.createElement('a')
    a.download = `lume-template-${String(n).padStart(2,'0')}.png`
    a.href = URL.createObjectURL(blob)
    a.click()
    URL.revokeObjectURL(a.href)
  } finally {
    btn.disabled = false
    btn.textContent = '⬇ Baixar'
  }
}

async function downloadAll() {
  const prog = document.getElementById('prog')
  const zip = new JSZip()
  const folder = zip.folder('lume-templates')

  for (let i = 0; i < T.length; i++) {
    const n = T[i].n
    prog.textContent = `Exportando ${i+1}/${T.length}…`
    const btn = document.getElementById('dl'+n)
    if (btn) { btn.disabled = true; btn.textContent = '⏳' }
    try {
      const blob = await capture(n)
      const arrayBuffer = await blob.arrayBuffer()
      folder.file(`lume-template-${String(n).padStart(2,'0')}.png`, arrayBuffer)
    } finally {
      if (btn) { btn.disabled = false; btn.textContent = '⬇ Baixar' }
    }
  }

  prog.textContent = 'Criando ZIP…'
  const zipBlob = await zip.generateAsync({ type: 'blob' })
  const a = document.createElement('a')
  a.download = 'lume-templates.zip'
  a.href = URL.createObjectURL(zipBlob)
  a.click()
  URL.revokeObjectURL(a.href)

  prog.textContent = '✓ lume-templates.zip baixado!'
  setTimeout(() => prog.textContent = '', 4000)
}

render()
</script>
